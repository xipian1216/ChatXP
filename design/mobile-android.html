<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>对话 · Android 原型</title>
  <style>
    :root {
      --bg:           #ffffff;
      --surface:      #f5f5f5;
      --surface-warm: #fafafa;
      --fg:   #0d0d0d;
      --fg-2: #1a1a1a;
      --muted: #6e6e6e;
      --meta:  #9b9b9b;
      --border:      #e5e5e5;
      --border-soft: #ededed;
      --accent:        #10a37f;
      --accent-on:     #ffffff;
      --accent-hover:  #0a7a5e;
      --accent-active: color-mix(in oklab, var(--accent), black 14%);
      --success: #10a37f;
      --warn:    #f5a623;
      --danger:  #ef4146;
      --font-display: "Signifier", "Source Serif Pro", Georgia, ui-serif, serif;
      --font-body:    "Söhne", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-mono:    "Söhne Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
      --text-xs:   12px;
      --text-sm:   13px;
      --text-base: 16px;
      --text-lg:   18px;
      --text-xl:   20px;
      --text-2xl:  28px;
      --text-3xl:  40px;
      --text-4xl:  56px;
      --leading-body:     1.65;
      --leading-tight:    1.08;
      --tracking-display: -0.02em;
      --space-1:  4px;
      --space-2:  8px;
      --space-3:  12px;
      --space-4:  16px;
      --space-5:  20px;
      --space-6:  24px;
      --space-8:  32px;
      --space-12: 48px;
      --space-16: 64px;
      --section-y-desktop: 96px;
      --section-y-tablet:  64px;
      --section-y-phone:   48px;
      --radius-sm:   12px;
      --radius-md:   16px;
      --radius-lg:   16px;
      --radius-pill: 9999px;
      --elev-flat:   none;
      --elev-ring:   0 0 0 1px var(--border);
      --elev-raised: 0 4px 16px rgba(13, 13, 13, 0.06);
      --focus-ring: 0 0 0 3px rgba(16, 163, 127, 0.12);
      --motion-fast:   150ms;
      --motion-base:   220ms;
      --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
      --container-max:            1200px;
      --container-gutter-desktop: 48px;
      --container-gutter-tablet:  24px;
      --container-gutter-phone:   24px;
    }
  </style>
  <style data-od-inline-asset="css/app.css">
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--surface-warm);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-base);
  line-height: var(--leading-body);
  text-rendering: optimizeLegibility;
  -webkit-font-smoothing: antialiased;
}

button,
textarea,
input {
  font: inherit;
}

button {
  border: 0;
  cursor: pointer;
}

a {
  color: inherit;
  text-decoration: none;
}

h1,
h2,
h3 {
  margin: 0;
  font-family: var(--font-display);
  letter-spacing: var(--tracking-display);
  line-height: var(--leading-tight);
}

p {
  margin: 0;
  text-wrap: pretty;
}

.launcher {
  min-height: 100vh;
  background: var(--bg);
}

.launcher-shell {
  width: min(1120px, calc(100vw - 48px));
  margin: 0 auto;
  padding: 56px 0;
}

.launcher-hero {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 380px;
  gap: 48px;
  align-items: end;
  padding: 56px 0 40px;
}

.eyebrow {
  margin-bottom: 16px;
  color: var(--accent);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.launcher-hero h1 {
  max-width: 760px;
  font-size: clamp(42px, 7vw, var(--text-4xl));
}

.launcher-copy {
  max-width: 620px;
  margin-top: 18px;
  color: var(--muted);
  font-size: var(--text-lg);
}

.launcher-meta {
  color: var(--muted);
  font-size: var(--text-sm);
}

.screen-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 24px;
  margin-top: 36px;
}

.screen-card {
  min-height: 240px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 28px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  transition: transform var(--motion-base) var(--ease-standard), box-shadow var(--motion-base) var(--ease-standard);
}

.screen-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--elev-raised);
}

.screen-card-title {
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: -0.01em;
}

.screen-card-copy {
  margin-top: 12px;
  color: var(--muted);
  font-size: var(--text-base);
}

.screen-card-action {
  display: inline-flex;
  width: fit-content;
  align-items: center;
  gap: 8px;
  margin-top: 28px;
  padding: 10px 16px;
  background: var(--fg);
  color: var(--bg);
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  font-weight: 500;
}

.prototype-stage {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 28px;
  background:
    radial-gradient(circle at 50% 0, color-mix(in oklab, var(--accent) 10%, transparent), transparent 34%),
    var(--surface-warm);
}

.phone {
  position: relative;
  width: min(100%, 430px);
  height: min(900px, calc(100vh - 56px));
  min-height: 720px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--fg);
}

.phone.ios {
  width: min(100%, 390px);
  border-radius: 46px;
  box-shadow: 0 24px 80px rgba(13, 13, 13, 0.18);
}

.phone.android {
  width: min(100%, 412px);
  border-radius: 34px;
  box-shadow: 0 24px 80px rgba(13, 13, 13, 0.16);
}

.status-bar {
  height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 22px 0;
  color: var(--fg);
  font-size: var(--text-xs);
  font-weight: 600;
  line-height: 1;
}

.ios .status-bar {
  padding-inline: 28px;
}

.dynamic-island {
  position: absolute;
  top: 11px;
  left: 50%;
  width: 116px;
  height: 34px;
  transform: translateX(-50%);
  border-radius: var(--radius-pill);
  background: var(--fg);
}

.punch-hole {
  position: absolute;
  top: 18px;
  left: 50%;
  width: 12px;
  height: 12px;
  transform: translateX(-50%);
  border-radius: 50%;
  background: var(--fg);
}

.signal {
  display: flex;
  align-items: center;
  gap: 6px;
}

.battery {
  width: 22px;
  height: 10px;
  border: 1px solid var(--fg);
  border-radius: 3px;
  position: relative;
}

.battery::after {
  content: "";
  position: absolute;
  right: 2px;
  top: 2px;
  width: 13px;
  height: 4px;
  border-radius: 2px;
  background: var(--fg);
}

.app {
  min-height: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  background: var(--bg);
}

.app-bar {
  height: 56px;
  display: grid;
  grid-template-columns: 48px minmax(0, 1fr) 96px;
  align-items: center;
  padding: 0 12px;
  border-bottom: 1px solid var(--border-soft);
}

.android .app-bar {
  height: 60px;
  grid-template-columns: 52px minmax(0, 1fr) 104px;
}

.icon-button {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  background: transparent;
  color: var(--fg);
  border-radius: var(--radius-pill);
  transition: background var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard);
}

.android .icon-button {
  width: 48px;
  height: 48px;
}

.icon-button:hover,
.icon-button:focus-visible {
  background: var(--surface);
  outline: none;
}

.icon-button:active {
  transform: scale(0.96);
}

.app-title {
  min-width: 0;
  text-align: center;
}

.app-title-main {
  overflow: hidden;
  color: var(--fg);
  font-size: var(--text-base);
  font-weight: 600;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.app-title-sub {
  color: var(--muted);
  font-size: var(--text-xs);
  line-height: 1.25;
}

.bar-actions {
  display: flex;
  justify-content: flex-end;
  gap: 4px;
}

.chat-layout {
  position: relative;
  min-height: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
}

.message-list {
  min-height: 0;
  flex: 1;
  overflow: auto;
  padding: 22px 18px 18px;
  scroll-behavior: smooth;
}

.message-list::-webkit-scrollbar,
.thread-list::-webkit-scrollbar {
  width: 0;
}

.empty-state {
  min-height: 100%;
  display: grid;
  place-items: center;
  padding: 32px;
  text-align: center;
}

.empty-state-title {
  color: var(--fg);
  font-size: var(--text-2xl);
  font-weight: 600;
  letter-spacing: -0.01em;
}

.empty-state-copy {
  max-width: 28ch;
  margin: 12px auto 0;
  color: var(--muted);
  font-size: var(--text-sm);
}

.message {
  display: flex;
  gap: 10px;
  margin-bottom: 18px;
}

.message.user {
  justify-content: flex-end;
}

.avatar {
  width: 28px;
  height: 28px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  margin-top: 2px;
  background: var(--fg);
  color: var(--bg);
  border-radius: 50%;
  font-size: var(--text-xs);
  font-weight: 600;
}

.bubble-wrap {
  max-width: 78%;
}

.user .bubble-wrap {
  max-width: 76%;
}

.bubble {
  padding: 12px 14px;
  border: 1px solid var(--border-soft);
  border-radius: 18px;
  background: var(--surface-warm);
  color: var(--fg);
  font-size: var(--text-sm);
  line-height: 1.55;
}

.user .bubble {
  background: var(--fg);
  color: var(--bg);
  border-color: var(--fg);
  border-bottom-right-radius: var(--radius-sm);
}

.assistant .bubble {
  border-bottom-left-radius: var(--radius-sm);
}

.message-tools {
  display: flex;
  gap: 4px;
  margin-top: 6px;
  opacity: 0;
  transition: opacity var(--motion-fast) var(--ease-standard);
}

.message:hover .message-tools,
.message:focus-within .message-tools {
  opacity: 1;
}

.tool-button {
  min-width: 32px;
  height: 32px;
  padding: 0 9px;
  background: transparent;
  color: var(--muted);
  border-radius: var(--radius-pill);
  font-size: var(--text-xs);
}

.tool-button:hover,
.tool-button:focus-visible {
  background: var(--surface);
  color: var(--fg);
  outline: none;
}

.typing {
  display: inline-flex;
  gap: 4px;
  align-items: center;
}

.typing span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--muted);
  animation: pulse 1s infinite ease-in-out;
}

.typing span:nth-child(2) {
  animation-delay: 0.12s;
}

.typing span:nth-child(3) {
  animation-delay: 0.24s;
}

@keyframes pulse {
  0%,
  80%,
  100% {
    transform: translateY(0);
    opacity: 0.35;
  }

  40% {
    transform: translateY(-3px);
    opacity: 1;
  }
}

.composer {
  padding: 10px 12px 14px;
  background: color-mix(in oklab, var(--bg) 92%, transparent);
  border-top: 1px solid var(--border-soft);
  backdrop-filter: blur(18px);
}

.composer-shell {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) 44px;
  align-items: end;
  gap: 6px;
  padding: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
}

.android .composer-shell {
  grid-template-columns: 48px minmax(0, 1fr) 48px;
  border-radius: 18px;
}

.composer textarea {
  width: 100%;
  max-height: 112px;
  min-height: 40px;
  padding: 9px 4px;
  resize: none;
  background: transparent;
  color: var(--fg);
  border: 0;
  outline: 0;
  font-size: var(--text-sm);
  line-height: 1.5;
}

.composer textarea::placeholder {
  color: var(--meta);
}

.send-button {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  background: var(--accent);
  color: var(--accent-on);
  border-radius: 50%;
  transition: background var(--motion-fast) var(--ease-standard), transform var(--motion-fast) var(--ease-standard), opacity var(--motion-fast) var(--ease-standard);
}

.android .send-button {
  width: 44px;
  height: 44px;
  border-radius: var(--radius-md);
}

.send-button:disabled {
  cursor: default;
  opacity: 0.34;
}

.send-button:not(:disabled):hover {
  background: var(--accent-hover);
}

.send-button:not(:disabled):active {
  transform: scale(0.96);
}

.drawer-backdrop {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: none;
  background: color-mix(in oklab, var(--fg) 28%, transparent);
}

.drawer-backdrop.open {
  display: block;
}

.thread-drawer {
  position: absolute;
  z-index: 30;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  border: 1px solid var(--border-soft);
  box-shadow: var(--elev-raised);
  transition: transform var(--motion-base) var(--ease-standard);
}

.ios .thread-drawer {
  left: 10px;
  right: 10px;
  bottom: 10px;
  max-height: 78%;
  border-radius: 28px;
  transform: translateY(calc(100% + 24px));
}

.ios .thread-drawer.open {
  transform: translateY(0);
}

.android .thread-drawer {
  top: 0;
  bottom: 0;
  left: 0;
  width: min(84%, 340px);
  border-radius: 0 22px 22px 0;
  transform: translateX(-104%);
}

.android .thread-drawer.open {
  transform: translateX(0);
}

.drawer-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 18px 10px;
}

.drawer-title {
  font-size: var(--text-xl);
  font-weight: 600;
  letter-spacing: -0.01em;
}

.search-box {
  margin: 0 18px 12px;
  padding: 11px 12px;
  background: var(--surface);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-pill);
  color: var(--fg);
  font-size: var(--text-sm);
  outline: none;
}

.search-box:focus-visible {
  box-shadow: var(--focus-ring);
}

.thread-list {
  min-height: 0;
  overflow: auto;
  padding: 0 10px 18px;
}

.thread-item {
  width: 100%;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  padding: 12px;
  background: transparent;
  color: var(--fg);
  border-radius: var(--radius-md);
  text-align: left;
}

.thread-item:hover,
.thread-item.active {
  background: var(--surface);
}

.thread-name {
  overflow: hidden;
  font-size: var(--text-sm);
  font-weight: 600;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.thread-preview {
  overflow: hidden;
  margin-top: 2px;
  color: var(--muted);
  font-size: var(--text-xs);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.thread-time {
  color: var(--meta);
  font-family: var(--font-mono);
  font-size: var(--text-xs);
}

.pin-mark {
  color: var(--accent);
}

.menu-popover {
  position: absolute;
  right: 14px;
  top: 104px;
  z-index: 50;
  width: 220px;
  display: none;
  padding: 8px;
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  box-shadow: var(--elev-raised);
}

.menu-popover.open {
  display: block;
}

.menu-action {
  width: 100%;
  display: flex;
  justify-content: space-between;
  padding: 11px 12px;
  background: transparent;
  color: var(--fg);
  border-radius: var(--radius-sm);
  text-align: left;
  font-size: var(--text-sm);
}

.menu-action:hover,
.menu-action:focus-visible {
  background: var(--surface);
  outline: none;
}

.menu-action.danger {
  color: var(--danger);
}

.modal {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: none;
  place-items: center;
  padding: 20px;
  background: color-mix(in oklab, var(--fg) 24%, transparent);
}

.modal.open {
  display: grid;
}

.dialog {
  width: min(100%, 320px);
  padding: 20px;
  background: var(--bg);
  border: 1px solid var(--border-soft);
  border-radius: var(--radius-md);
  box-shadow: var(--elev-raised);
}

.dialog-title {
  font-size: var(--text-xl);
  font-weight: 600;
}

.dialog-copy {
  margin-top: 8px;
  color: var(--muted);
  font-size: var(--text-sm);
}

.dialog-field {
  width: 100%;
  margin-top: 16px;
  padding: 12px 14px;
  background: var(--surface);
  color: var(--fg);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
}

.dialog-field:focus-visible {
  box-shadow: var(--focus-ring);
}

.dialog-actions {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 18px;
}

.text-button,
.filled-button {
  min-height: 40px;
  padding: 0 14px;
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  font-weight: 500;
}

.text-button {
  background: transparent;
  color: var(--fg);
}

.text-button:hover {
  background: var(--surface);
}

.filled-button {
  background: var(--fg);
  color: var(--bg);
}

.filled-button.danger {
  background: var(--danger);
  color: var(--bg);
}

.toast {
  position: absolute;
  left: 50%;
  bottom: 94px;
  z-index: 80;
  min-width: 160px;
  padding: 10px 14px;
  transform: translateX(-50%) translateY(18px);
  background: var(--fg);
  color: var(--bg);
  border-radius: var(--radius-pill);
  font-size: var(--text-sm);
  opacity: 0;
  pointer-events: none;
  text-align: center;
  transition: opacity var(--motion-base) var(--ease-standard), transform var(--motion-base) var(--ease-standard);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.home-indicator {
  height: 18px;
  display: grid;
  place-items: center;
  background: var(--bg);
}

.home-indicator::before {
  content: "";
  width: 128px;
  height: 5px;
  border-radius: var(--radius-pill);
  background: var(--fg);
}

.android-nav {
  height: 24px;
  display: grid;
  place-items: center;
  background: var(--bg);
}

.android-nav::before {
  content: "";
  width: 108px;
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--fg);
  opacity: 0.9;
}

@media (max-width: 840px) {
  .launcher-shell {
    width: min(100% - 32px, 680px);
    padding: 28px 0;
  }

  .launcher-hero {
    grid-template-columns: 1fr;
    gap: 22px;
  }

  .screen-grid {
    grid-template-columns: 1fr;
  }
}

@media (max-width: 460px) {
  .prototype-stage {
    padding: 0;
  }

  .phone,
  .phone.ios,
  .phone.android {
    width: 100vw;
    height: 100vh;
    min-height: 100vh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }
}

</style>
  <style>

      display: none;
    }

    body[data-platform="android"] .thread-item > span:first-child {
      min-width: 0;
      overflow: hidden;
    }

    body[data-platform="android"] .thread-name,
    body[data-platform="android"] .thread-preview {
      display: block;
      max-width: 100%;
    }

    body[data-platform="android"] .thread-list {
      padding-bottom: 96px;
    }

    body[data-platform="android"] .drawer-bottom-bar {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px 18px;
      background: color-mix(in oklab, var(--bg) 92%, transparent);
      border-top: 1px solid var(--border-soft);
      border-radius: 0 0 22px 0;
      backdrop-filter: blur(18px);
    }

    body[data-platform="android"] .drawer-chat-button {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      background: var(--fg);
      color: var(--bg);
      border-radius: var(--radius-pill);
      font-size: var(--text-sm);
      font-weight: 600;
    }

    body[data-platform="android"] .drawer-profile-button {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      background: var(--surface);
      color: var(--fg);
      border: 1px solid var(--border-soft);
      border-radius: 50%;
      font-size: var(--text-sm);
      font-weight: 600;
    }
  </style>
</head>
<body data-platform="android">
  <main class="prototype-stage" data-od-id="android-stage">
    <section class="phone android" aria-label="Android 版对话应用" data-od-id="android-phone">
      <div class="punch-hole" aria-hidden="true"></div>
      <div class="status-bar" data-od-id="android-status-bar">
        <span>9:41</span>
        <span class="signal"><span>5G</span><span class="battery"></span></span>
      </div>
      <div class="app">
        <header class="app-bar" data-od-id="android-app-bar">
          <button class="icon-button" data-open-drawer data-icon="menu" aria-label="打开导航抽屉"></button>
          <div class="app-title" style="text-align: left; justify-self: start; margin-left: 2px;">
            <button
              type="button"
              aria-label="模型配置"
              style="display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 10px; background: transparent; color: var(--fg); border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 600;"
            >
              <span>GPT-4.1</span>
              <span aria-hidden="true" style="font-size: var(--text-xs); color: var(--muted);">⌄</span>
            </button>
            <div style="margin-left: 10px; margin-top: -5px; color: var(--muted); font-size: var(--text-xs); line-height: 1;">模型配置</div>
          </div>
          <div class="bar-actions">
            <button class="icon-button" data-new-chat data-icon="plus" aria-label="新建会话"></button>
            <button class="icon-button" data-open-menu data-icon="more" aria-label="会话操作"></button>
          </div>
        </header>

        <div class="chat-layout">
          <section class="message-list" data-message-list data-od-id="android-message-list"></section>
          <section class="composer" data-od-id="android-composer">
            <div class="composer-shell">
              <button class="icon-button" data-attach data-icon="attach" aria-label="添加附件"></button>
              <textarea data-composer rows="1" placeholder="输入消息"></textarea>
              <button class="send-button" data-send data-icon="send" aria-label="发送消息"></button>
            </div>
          </section>

          <div class="drawer-backdrop" data-backdrop></div>
          <aside class="thread-drawer" data-drawer data-od-id="android-thread-drawer">
            <div class="drawer-head">
              <div class="drawer-title">最近</div>
              <button class="icon-button" data-close-drawer data-icon="close" aria-label="关闭导航抽屉"></button>
            </div>
            <input class="search-box" data-search placeholder="搜索会话" aria-label="搜索会话" />
            <div class="thread-list" data-thread-list></div>
            <div class="drawer-bottom-bar" data-od-id="android-drawer-bottom-bar">
              <button class="drawer-chat-button" data-new-chat aria-label="新建聊天">
                <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M12 5v14M5 12h14" />
                </svg>
                <span>聊天</span>
              </button>
              <button class="drawer-profile-button" aria-label="个人信息（待实现）">我</button>
            </div>
          </aside>

          <div class="menu-popover" data-menu data-od-id="android-session-menu">
            <button class="menu-action" data-rename>重命名<span>编辑</span></button>
            <button class="menu-action" data-pin>置顶会话<span>切换</span></button>
            <button class="menu-action" data-clear>清空对话<span>当前</span></button>
            <button class="menu-action danger" data-delete>删除会话<span>移除</span></button>
          </div>

          <div class="modal" data-modal data-od-id="android-dialog">
            <div class="dialog">
              <div class="dialog-title" data-dialog-title>重命名会话</div>
              <p class="dialog-copy" data-dialog-copy>给当前对话一个更容易识别的名称。</p>
              <input class="dialog-field" data-dialog-input aria-label="会话名称" />
              <div class="dialog-actions">
                <button class="text-button" data-modal-cancel>取消</button>
                <button class="filled-button" data-dialog-confirm>保存</button>
              </div>
            </div>
          </div>

          <div class="toast" data-toast data-od-id="android-toast"></div>
        </div>
      </div>
      <div class="android-nav" aria-hidden="true"></div>
    </section>
  </main>
  <script>
(function () {
  const STORAGE_KEY = "chat-prototype-sessions-v1";

  const seedSessions = [
    {
      id: "study-plan",
      title: "整理明天的学习计划",
      updatedAt: "09:42",
      pinned: true,
      messages: [
        {
          id: "m1",
          role: "user",
          content: "帮我把明天的复习任务拆成上午、下午和晚上三段。",
          status: "sent",
          createdAt: "09:40"
        },
        {
          id: "m2",
          role: "assistant",
          content: "可以。上午适合处理需要专注的知识点回顾，下午做题和订正，晚上只保留轻量复盘。我会把每段控制在可执行的任务块里。",
          status: "sent",
          createdAt: "09:41"
        }
      ]
    },
    {
      id: "writing-outline",
      title: "写作提纲",
      updatedAt: "昨天",
      pinned: false,
      messages: [
        {
          id: "m3",
          role: "user",
          content: "我想写一篇关于 AI 辅助学习的短文，先给我一个结构。",
          status: "sent",
          createdAt: "昨天"
        },
        {
          id: "m4",
          role: "assistant",
          content: "建议用三段式：先写学习中的具体困难，再写 AI 如何帮助拆解任务，最后补充人仍然需要判断和复盘的部分。",
          status: "sent",
          createdAt: "昨天"
        }
      ]
    },
    {
      id: "source-summary",
      title: "资料摘要",
      updatedAt: "周二",
      pinned: false,
      messages: [
        {
          id: "m5",
          role: "user",
          content: "把这段资料总结成 5 个要点，语气正式一点。",
          status: "sent",
          createdAt: "周二"
        },
        {
          id: "m6",
          role: "assistant",
          content: "我会保留原文的关键事实，用更清晰的层级输出。你可以继续贴资料，我会按要点、证据和待确认信息三类整理。",
          status: "sent",
          createdAt: "周二"
        }
      ]
    }
  ];

  const state = {
    sessions: loadSessions(),
    currentId: null,
    pendingDeleteId: null,
    pendingDialog: null,
    platform: document.body.dataset.platform || "ios"
  };

  function loadSessions() {
    try {
      const stored = localStorage.getItem(STORAGE_KEY);
      if (stored) return JSON.parse(stored);
    } catch (error) {
      return structuredClone(seedSessions);
    }
    return structuredClone(seedSessions);
  }

  function saveSessions() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.sessions));
  }

  function qs(selector) {
    return document.querySelector(selector);
  }

  function qsa(selector) {
    return Array.from(document.querySelectorAll(selector));
  }

  function currentSession() {
    return state.sessions.find((session) => session.id === state.currentId) || null;
  }

  function sortSessions(sessions) {
    return [...sessions].sort((a, b) => {
      if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return state.sessions.indexOf(a) - state.sessions.indexOf(b);
    });
  }

  function icon(name) {
    const icons = {
      menu: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
      close: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg>',
      more: '<svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor"><circle cx="5" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="19" cy="12" r="1.7"/></svg>',
      plus: '<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>',
      send: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m5 12 14-7-5 14-3-6-6-1Z"/><path d="m11 13 8-8"/></svg>',
      attach: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m21 11-8.5 8.5a5 5 0 0 1-7.1-7.1L14 3.8a3.5 3.5 0 0 1 5 5L10.5 17.3a2 2 0 1 1-2.8-2.8L16 6.2"/></svg>'
    };
    return icons[name] || "";
  }

  function render() {
    if (!state.currentId && state.sessions.length) {
      state.currentId = sortSessions(state.sessions)[0].id;
    }
    renderChrome();
    renderThreads();
    renderMessages();
    updateComposer();
  }

  function renderChrome() {
    const session = currentSession();
    const title = qs("[data-current-title]");
    const subtitle = qs("[data-current-subtitle]");
    if (title) title.textContent = session ? session.title : "新对话";
    if (subtitle) subtitle.textContent = session ? `${session.messages.length} 条消息` : "准备开始";
    qsa("[data-icon]").forEach((button) => {
      button.innerHTML = icon(button.dataset.icon);
    });
  }

  function renderThreads() {
    const list = qs("[data-thread-list]");
    if (!list) return;
    const query = (qs("[data-search]")?.value || "").trim().toLowerCase();
    const sessions = sortSessions(state.sessions).filter((session) => {
      return !query || session.title.toLowerCase().includes(query) || session.preview?.toLowerCase().includes(query);
    });
    list.innerHTML = sessions.map((session) => {
      const last = session.messages[session.messages.length - 1];
      const preview = last ? last.content : "空会话";
      const active = session.id === state.currentId ? " active" : "";
      const pin = session.pinned ? '<span class="pin-mark">置顶</span>' : "";
      return `
        <button class="thread-item${active}" data-thread-id="${session.id}" data-od-id="thread-${session.id}">
          <span>
            <span class="thread-name">${escapeHtml(session.title)}</span>
            <span class="thread-preview">${escapeHtml(preview)}</span>
          </span>
          <span class="thread-time">${pin || escapeHtml(session.updatedAt)}</span>
        </button>
      `;
    }).join("");
  }

  function renderMessages() {
    const list = qs("[data-message-list]");
    if (!list) return;
    const session = currentSession();
    if (!session || !session.messages.length) {
      list.innerHTML = `
        <div class="empty-state" data-od-id="empty-chat">
          <div>
            <div class="empty-state-title">今天想聊什么？</div>
            <p class="empty-state-copy">可以从学习计划、写作提纲或资料整理开始。</p>
          </div>
        </div>
      `;
      return;
    }
    list.innerHTML = session.messages.map((message) => {
      if (message.role === "user") {
        return `
          <article class="message user" data-message-id="${message.id}" data-od-id="message-${message.id}">
            <div class="bubble-wrap">
              <div class="bubble">${escapeHtml(message.content)}</div>
            </div>
          </article>
        `;
      }
      const content = message.status === "streaming"
        ? '<span class="typing"><span></span><span></span><span></span></span>'
        : escapeHtml(message.content);
      const failed = message.status === "failed";
      return `
        <article class="message assistant" data-message-id="${message.id}" data-od-id="message-${message.id}">
          <div class="avatar">AI</div>
          <div class="bubble-wrap">
            <div class="bubble">${failed ? "回复失败，请重试。" : content}</div>
            <div class="message-tools">
              <button class="tool-button" data-copy="${message.id}">复制</button>
              <button class="tool-button" data-regenerate="${message.id}">重新生成</button>
              ${failed ? '<button class="tool-button" data-retry>重试</button>' : ""}
            </div>
          </div>
        </article>
      `;
    }).join("");
    list.scrollTo({ top: list.scrollHeight, behavior: "smooth" });
  }

  function updateComposer() {
    const textarea = qs("[data-composer]");
    const send = qs("[data-send]");
    if (!textarea || !send) return;
    send.disabled = !textarea.value.trim();
  }

  function createSession() {
    const session = {
      id: `session-${Date.now()}`,
      title: "新对话",
      updatedAt: "刚刚",
      pinned: false,
      messages: []
    };
    state.sessions.unshift(session);
    state.currentId = session.id;
    saveSessions();
    closeDrawer();
    render();
    qs("[data-composer]")?.focus();
  }

  function sendMessage() {
    const textarea = qs("[data-composer]");
    const value = textarea?.value.trim();
    if (!value) return;
    let session = currentSession();
    if (!session) {
      createSession();
      session = currentSession();
    }
    session.messages.push({
      id: `u-${Date.now()}`,
      role: "user",
      content: value,
      status: "sent",
      createdAt: "刚刚"
    });
    if (session.title === "新对话") {
      session.title = value.length > 14 ? `${value.slice(0, 14)}…` : value;
    }
    session.updatedAt = "刚刚";
    textarea.value = "";
    saveSessions();
    render();
    const replyId = `a-${Date.now()}`;
    session.messages.push({
      id: replyId,
      role: "assistant",
      content: "",
      status: "streaming",
      createdAt: "刚刚"
    });
    saveSessions();
    render();
    window.setTimeout(() => {
      const fresh = currentSession();
      const reply = fresh?.messages.find((message) => message.id === replyId);
      if (!reply) return;
      reply.status = "sent";
      reply.content = buildReply(value);
      saveSessions();
      render();
      showToast("已生成回复");
    }, 850);
  }

  function buildReply(input) {
    if (input.includes("提纲") || input.includes("写")) {
      return "可以。建议先确定读者和结论，再拆成三个部分：背景、核心观点、行动建议。这样写出来会更清楚，也方便后续扩展成完整文章。";
    }
    if (input.includes("学习") || input.includes("复习")) {
      return "我会把任务拆成小块：先回顾概念，再做练习，最后用五分钟写下还不确定的地方。这样能减少拖延，也更容易判断是否真的掌握。";
    }
    return "我先给出一个可执行的版本：把问题拆成目标、已知信息、下一步行动三栏。你可以继续补充材料，我会按这个结构帮你整理。";
  }

  function switchThread(id) {
    state.currentId = id;
    closeDrawer();
    closeMenu();
    render();
  }

  function togglePin() {
    const session = currentSession();
    if (!session) return;
    session.pinned = !session.pinned;
    saveSessions();
    render();
    showToast(session.pinned ? "已置顶会话" : "已取消置顶");
  }

  function clearCurrent() {
    const session = currentSession();
    if (!session) return;
    session.messages = [];
    session.updatedAt = "刚刚";
    saveSessions();
    closeMenu();
    render();
    showToast("已清空当前对话");
  }

  function confirmDelete() {
    const session = currentSession();
    if (!session) return;
    state.pendingDeleteId = session.id;
    openModal("delete");
  }

  function deleteCurrent() {
    state.sessions = state.sessions.filter((session) => session.id !== state.pendingDeleteId);
    state.currentId = state.sessions[0]?.id || null;
    state.pendingDeleteId = null;
    saveSessions();
    closeModal();
    closeMenu();
    render();
    showToast("已删除会话");
  }

  function renameCurrent() {
    const session = currentSession();
    if (!session) return;
    openModal("rename", session.title);
  }

  function saveRename() {
    const session = currentSession();
    const input = qs("[data-dialog-input]");
    const value = input?.value.trim();
    if (!session || !value) return;
    session.title = value;
    session.updatedAt = "刚刚";
    saveSessions();
    closeModal();
    closeMenu();
    render();
    showToast("已重命名");
  }

  function copyMessage(id) {
    const session = currentSession();
    const message = session?.messages.find((item) => item.id === id);
    if (!message) return;
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(message.content).then(() => showToast("已复制回复")).catch(() => showToast("复制失败"));
    } else {
      showToast("当前环境不支持复制");
    }
  }

  function regenerate(id) {
    const session = currentSession();
    const message = session?.messages.find((item) => item.id === id);
    if (!message) return;
    message.status = "streaming";
    message.content = "";
    saveSessions();
    render();
    window.setTimeout(() => {
      message.status = "sent";
      message.content = "我换一种更清晰的说法：先确认目标，再列出可执行步骤，最后补充需要你判断的地方。这样既能快速推进，也不会把不确定信息包装成结论。";
      saveSessions();
      render();
      showToast("已重新生成");
    }, 780);
  }

  function openDrawer() {
    qs("[data-backdrop]")?.classList.add("open");
    qs("[data-drawer]")?.classList.add("open");
  }

  function closeDrawer() {
    qs("[data-backdrop]")?.classList.remove("open");
    qs("[data-drawer]")?.classList.remove("open");
  }

  function toggleMenu() {
    qs("[data-menu]")?.classList.toggle("open");
  }

  function closeMenu() {
    qs("[data-menu]")?.classList.remove("open");
  }

  function openModal(type, value) {
    state.pendingDialog = type;
    const modal = qs("[data-modal]");
    const title = qs("[data-dialog-title]");
    const copy = qs("[data-dialog-copy]");
    const input = qs("[data-dialog-input]");
    const confirm = qs("[data-dialog-confirm]");
    if (!modal || !title || !copy || !input || !confirm) return;
    if (type === "rename") {
      title.textContent = "重命名会话";
      copy.textContent = "给当前对话一个更容易识别的名称。";
      input.hidden = false;
      input.value = value || "";
      confirm.textContent = "保存";
      confirm.classList.remove("danger");
      modal.classList.add("open");
      input.focus();
      input.select();
      return;
    }
    title.textContent = "删除这段会话？";
    copy.textContent = "删除后会从历史记录中移除。这个原型会同步更新本地会话数据。";
    input.hidden = true;
    confirm.textContent = "删除";
    confirm.classList.add("danger");
    modal.classList.add("open");
  }

  function closeModal() {
    qs("[data-modal]")?.classList.remove("open");
    state.pendingDialog = null;
  }

  function confirmModal() {
    if (state.pendingDialog === "rename") saveRename();
    if (state.pendingDialog === "delete") deleteCurrent();
  }

  function showToast(text) {
    const toast = qs("[data-toast]");
    if (!toast) return;
    toast.textContent = text;
    toast.classList.add("show");
    window.clearTimeout(showToast.timer);
    showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 1500);
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  document.addEventListener("click", (event) => {
    if (event.target.matches("[data-backdrop]")) {
      closeDrawer();
      return;
    }
    const target = event.target.closest("button, a");
    if (!target) return;
    if (target.matches("[data-open-drawer]")) openDrawer();
    if (target.matches("[data-close-drawer]") || target.matches("[data-backdrop]")) closeDrawer();
    if (target.matches("[data-new-chat]")) createSession();
    if (target.matches("[data-send]")) sendMessage();
    if (target.matches("[data-open-menu]")) toggleMenu();
    if (target.matches("[data-rename]")) renameCurrent();
    if (target.matches("[data-pin]")) togglePin();
    if (target.matches("[data-clear]")) clearCurrent();
    if (target.matches("[data-delete]")) confirmDelete();
    if (target.matches("[data-modal-cancel]")) closeModal();
    if (target.matches("[data-dialog-confirm]")) confirmModal();
    if (target.matches("[data-attach]")) showToast("附件入口暂为占位");
    if (target.dataset.threadId) switchThread(target.dataset.threadId);
    if (target.dataset.copy) copyMessage(target.dataset.copy);
    if (target.dataset.regenerate) regenerate(target.dataset.regenerate);
    if (target.matches("[data-retry]")) regenerate(currentSession()?.messages.at(-1)?.id);
  });

  document.addEventListener("input", (event) => {
    if (event.target.matches("[data-composer]")) updateComposer();
    if (event.target.matches("[data-search]")) renderThreads();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      closeDrawer();
      closeMenu();
      closeModal();
    }
    if (event.key === "Enter" && !event.shiftKey && event.target.matches("[data-composer]")) {
      event.preventDefault();
      sendMessage();
    }
    if (event.key === "Enter" && event.target.matches("[data-dialog-input]")) {
      event.preventDefault();
      saveRename();
    }
  });

  render();
})();

</script>
</body>
